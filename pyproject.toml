[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrow-ai"
version = "0.5.1"
description = "A safety-first task continuity and execution coordinator for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NARROW contributors" }]
keywords = ["ai-agents", "developer-tools", "task-continuity", "git", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahmedfayedesmail-ui/narrow-ai"
Documentation = "https://github.com/ahmedfayedesmail-ui/narrow-ai#readme"
Repository = "https://github.com/ahmedfayedesmail-ui/narrow-ai"
Issues = "https://github.com/ahmedfayedesmail-ui/narrow-ai/issues"
Changelog = "https://github.com/ahmedfayedesmail-ui/narrow-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
narrow = "narrow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
