name: Archived v0.5.0 release workflow

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: This historical release workflow is permanently retired.
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: echo "This v0.5.0 publishing workflow is retired. Use the current release process instead."
