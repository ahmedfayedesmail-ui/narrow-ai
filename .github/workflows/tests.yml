name: NARROW v0.5.0 alpha checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate release archive
        run: gzip -t narrow-v0.5.0.tar.gz && tar -tzf narrow-v0.5.0.tar.gz >/dev/null
      - name: Compile checked-in source
        run: python -m compileall -q src tests
      - name: Test checked-in source
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Extract release archive
        run: |
          mkdir -p "$RUNNER_TEMP/narrow-release"
          tar -xzf narrow-v0.5.0.tar.gz -C "$RUNNER_TEMP/narrow-release"
          test -f "$RUNNER_TEMP/narrow-release/NARROW/src/narrow/locks.py"
      - name: Test extracted package
        working-directory: ${{ runner.temp }}/narrow-release/NARROW
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke tests
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow drive --help
          python -m narrow verify --help
          python -m narrow finish --help
