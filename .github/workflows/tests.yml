name: NARROW v0.5.1 alpha checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: narrow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build source archive from the exact checkout
        run: |
          tar -czf "$RUNNER_TEMP/narrow-source.tar.gz" \
            --exclude=.git \
            --exclude=narrow-v0.1.0.tar.gz \
            --exclude=narrow-v0.1.0.tar.gz.sha256 \
            --exclude=narrow-v0.4.0.tar.gz \
            --exclude=narrow-v0.4.0.tar.gz.sha256 \
            -C "$GITHUB_WORKSPACE" .
          gzip -t "$RUNNER_TEMP/narrow-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/narrow-release"
          tar -xzf "$RUNNER_TEMP/narrow-source.tar.gz" -C "$RUNNER_TEMP/narrow-release"
          test -f "$RUNNER_TEMP/narrow-release/src/narrow/locks.py"
      - name: Compile checked-in source
        run: python -m compileall -q src tests examples
      - name: Test checked-in source
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Run deterministic repaired workflow demo
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario repaired
      - name: Run deterministic blocked workflow demo
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario blocked
      - name: Test generated source archive
        working-directory: ${{ runner.temp }}/narrow-release
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke tests
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow drive --help
          python -m narrow verify --help
          python -m narrow finish --help
      - name: Upload tested source archive
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: narrow-v0.5.1-alpha-source-${{ github.sha }}
          path: ${{ runner.temp }}/narrow-source.tar.gz
          if-no-files-found: error

  macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Compile source, tests, and demo
        run: python -m compileall -q src tests examples
      - name: Run full unit suite on macOS
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Exercise repaired and blocked demo workflows
        env:
          PYTHONPATH: src
        run: |
          python examples/demo.py --scenario repaired
          python examples/demo.py --scenario blocked

  windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo-scenario: ["repaired", "blocked"]
    name: windows (${{ matrix.demo-scenario }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Compile source, tests, and demo
        run: python -m compileall -q src tests examples
      - name: Exercise Windows task locks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_locks.py -v
      - name: Exercise ${{ matrix.demo-scenario }} demo workflow
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario ${{ matrix.demo-scenario }}
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m narrow --version

  container-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Build the reviewed Codex agent image
        run: |
          docker build \
            --build-arg BASE_IMAGE=node:22-bookworm-slim \
            --build-arg CODEX_VERSION=0.166.0 \
            -f examples/containers/codex-agent.Dockerfile \
            -t narrow-codex-agent:ci .
      - name: Build the egress proxy image
        run: |
          docker build \
            --build-arg BASE_IMAGE=python:3.12-slim-bookworm \
            -f examples/containers/egress-proxy.Dockerfile \
            -t narrow-egress-proxy:ci .
      - name: Start a local OCI registry and publish test images
        run: |
          docker run --detach --rm --name narrow-ci-registry -p 5000:5000 registry:2
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null
          docker tag narrow-codex-agent:ci localhost:5000/narrow-codex-agent:ci
          docker tag narrow-egress-proxy:ci localhost:5000/narrow-egress-proxy:ci
          docker push localhost:5000/narrow-codex-agent:ci
          docker push localhost:5000/narrow-egress-proxy:ci
          echo "NARROW_AGENT_IMAGE=$(docker image inspect --format='{{index .RepoDigests 0}}' localhost:5000/narrow-codex-agent:ci)" >> "$GITHUB_ENV"
          echo "NARROW_PROXY_IMAGE=$(docker image inspect --format='{{index .RepoDigests 0}}' localhost:5000/narrow-egress-proxy:ci)" >> "$GITHUB_ENV"
          test -n "$NARROW_AGENT_IMAGE"
          test -n "$NARROW_PROXY_IMAGE"
      - name: Exercise real Docker proxy-only network topology
        env:
          NARROW_DOCKER_E2E: "1"
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_container_egress_integration.py -v
      - name: Remove local test registry
        if: always()
        run: docker rm --force narrow-ci-registry || true

  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install built wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/narrow-wheel-venv"
          "$RUNNER_TEMP/narrow-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/narrow-wheel-venv/bin/narrow" --version
