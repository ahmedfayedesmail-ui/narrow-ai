name: NARROW v0.4.0 alpha checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release archive integrity
        run: echo "36e05bef1192081a252cb8c7dd4588079908cf813c139897bacb7f9525601143  narrow-v0.4.0.tar.gz" | sha256sum --check
      - name: Extract source archive
        run: tar -xzf narrow-v0.4.0.tar.gz
      - name: Compile
        working-directory: NARROW
        run: python -m compileall -q src tests
      - name: Unit tests
        working-directory: NARROW
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke tests
        working-directory: NARROW
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow tasks --help
          python -m narrow drive --provider claude --help
          python -m narrow dashboard --help
