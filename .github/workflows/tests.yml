name: NARROW v0.5.1 Alpha checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: narrow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Run unit suite
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Run deterministic demos
        env:
          PYTHONPATH: src
        run: |
          python examples/demo.py --scenario repaired
          python examples/demo.py --scenario blocked
      - name: CLI smoke tests
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow drive --help
          python -m narrow verify --help
          python -m narrow finish --help

  macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Compile and run unit suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests examples
          python -W error::ResourceWarning -m unittest discover -s tests -q
          python examples/demo.py --scenario repaired
          python examples/demo.py --scenario blocked

  windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo-scenario: ["repaired", "blocked"]
    name: windows (${{ matrix.demo-scenario }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Exercise Windows task locks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_locks.py -v
      - name: Exercise deterministic demo
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario ${{ matrix.demo-scenario }}
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m narrow --version

  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/narrow-wheel-venv"
          "$RUNNER_TEMP/narrow-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/narrow-wheel-venv/bin/narrow" --version
