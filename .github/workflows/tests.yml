name: NARROW alpha checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source archive integrity
        run: echo "f2475dfa6d8732bcb99da5c5b24661571b40b13cf478d0f89b1b5e596aea9928  narrow-v0.1.0.tar.gz" | sha256sum --check
      - name: Extract source archive
        run: tar -xzf narrow-v0.1.0.tar.gz
      - name: Compile
        working-directory: NARROW
        run: python -m compileall -q src tests
      - name: Unit tests
        working-directory: NARROW
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke tests
        working-directory: NARROW
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow drive --help
