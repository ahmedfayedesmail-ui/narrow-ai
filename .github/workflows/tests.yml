name: NARROW v0.5.0 alpha checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate release archive
        run: gzip -t narrow-v0.5.0.tar.gz && tar -tzf narrow-v0.5.0.tar.gz >/dev/null
      - name: Compile checked-in source
        run: python -m compileall -q src tests examples
      - name: Test checked-in source
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Run deterministic repaired workflow demo
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario repaired
      - name: Run deterministic blocked workflow demo
        env:
          PYTHONPATH: src
        run: python examples/demo.py --scenario blocked
      - name: Extract release archive
        run: |
          mkdir -p "$RUNNER_TEMP/narrow-release"
          tar -xzf narrow-v0.5.0.tar.gz -C "$RUNNER_TEMP/narrow-release"
          test -f "$RUNNER_TEMP/narrow-release/NARROW/src/narrow/locks.py"
      - name: Test extracted package
        working-directory: ${{ runner.temp }}/narrow-release/NARROW
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke tests
        env:
          PYTHONPATH: src
        run: |
          python -m narrow --version
          python -m narrow drive --help
          python -m narrow verify --help
          python -m narrow finish --help

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release archive
        run: gzip -t narrow-v0.5.0.tar.gz && tar -tzf narrow-v0.5.0.tar.gz >/dev/null
      - name: Compile source, tests, and demo
        run: python -m compileall -q src tests examples
      - name: Run full unit suite on macOS
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Exercise repaired and blocked demo workflows
        env:
          PYTHONPATH: src
        run: |
          python examples/demo.py --scenario repaired
          python examples/demo.py --scenario blocked

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile source, tests, and demo
        run: python -m compileall -q src tests examples
      - name: Exercise Windows task locks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_locks.py -v
      - name: Exercise repaired and blocked demo workflows
        env:
          PYTHONPATH: src
        run: |
          python examples/demo.py --scenario repaired
          python examples/demo.py --scenario blocked
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m narrow --version

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install built wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/narrow-wheel-venv"
          "$RUNNER_TEMP/narrow-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/narrow-wheel-venv/bin/narrow" --version
