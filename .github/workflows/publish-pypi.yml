name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v0.5.0)
        required: true
        type: string
        default: v0.5.0
      target:
        description: Publish destination
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: python-publish-${{ inputs.target }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v") or len(tag) < 3:
              raise SystemExit("Release tag must look like v0.5.0")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag[1:] != version:
              raise SystemExit(f"Tag {tag} does not match pyproject version {version}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m venv "$RUNNER_TEMP/narrow-install-check"
          "$RUNNER_TEMP/narrow-install-check/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/narrow-install-check/bin/narrow" --version

      - name: Store validated distributions for the isolated publish job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to package index
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/project/narrow-ai/' || 'https://test.pypi.org/project/narrow-ai/' }}
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Publish to TestPyPI using Trusted Publishing
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
